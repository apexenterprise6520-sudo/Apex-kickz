<style>
:root{--gold:#2f80ff;--gold2:#8cc4ff}
html{scroll-behavior:smooth}
body{background:#050608;color:#eee;font-family:Inter,sans-serif;-webkit-font-smoothing:antialiased}
.serif{font-family:'Cormorant Garamond',serif}
.gold-text{background:linear-gradient(90deg,#1553d6,#8cc4ff,#2f80ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.btn-gold{background:linear-gradient(135deg,#1553d6,#8cc4ff 50%,#2f80ff);color:#fff;font-weight:600;letter-spacing:.12em;text-transform:uppercase;font-size:.72rem}
.btn-gold:hover{filter:brightness(1.1)}
.btn-out{border:1px solid rgba(47,128,255,.6);color:var(--gold);letter-spacing:.12em;text-transform:uppercase;font-size:.72rem}
.btn-out:hover{background:var(--gold);color:#fff}
.line{height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
@keyframes beam{0%{box-shadow:0 0 0 0 var(--c)}50%{box-shadow:0 0 0 20px rgba(0,0,0,0)}100%{box-shadow:0 0 0 0 rgba(0,0,0,0)}}
.fab{position:fixed;bottom:20px;width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;z-index:60;animation:beam 1.8s infinite;color:#fff}
.fab.wa{right:18px;background:#25D366;--c:rgba(37,211,102,.75)}
.fab.call{left:18px;background:#1e88ff;--c:rgba(30,136,255,.75)}
.card img{transition:transform .8s}.card:hover img{transform:scale(1.07)}
select,input,textarea{background:#111;border:1px solid #2a2a2a;color:#eee;outline:none}
select:focus,input:focus{border-color:var(--gold)}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:#333}
.no-sb::-webkit-scrollbar{display:none}
</style>

function makeSynth(){let ctx,master,timer,i=0;const prog=[[220,261.63,329.63],[174.61,220,261.63],[130.81,196,261.63],[196,246.94,293.66]];const seq=[0,1,2,1,2,1];
const note=(f,t,v)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type="triangle";o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+3);o.connect(g);g.connect(master);o.start(t);o.stop(t+3.1)};
const step=()=>{const c=prog[Math.floor(i/6)%4],k=i%6,t=ctx.currentTime+.05;note(c[seq[k]]*2,t,.5);if(k===0)note(c[0]/2,t,.6);i++};
return{async start(){if(!ctx){ctx=new (window.AudioContext||window.webkitAudioContext)();master=ctx.createGain();master.gain.value=.2;const d=ctx.createDelay(),fb=ctx.createGain(),lp=ctx.createBiquadFilter();d.delayTime.value=.38;fb.gain.value=.4;lp.type="lowpass";lp.frequency.value=2200;master.connect(lp);lp.connect(ctx.destination);lp.connect(d);d.connect(fb);fb.connect(d);d.connect(ctx.destination)}
ctx.resume();await new Promise(r=>setTimeout(r,120));if(ctx.state!=="running")return false;if(!timer){step();timer=setInterval(step,650)}return true},
stop(){clearInterval(timer);timer=null;ctx&&ctx.suspend()}}}

<div className="grid md:grid-cols-2 lg:grid-cols-3 gap-5">{REVIEWS.map((r,i)=><motion.div key={i} initial={{opacity:0,y:30}} whileInView={{opacity:1,y:0}} viewport={{once:true}} transition={{delay:(i%3)*.1}} className="bg-[#111] border border-neutral-900 p-7"><Stars n={r[2]}/><p className="serif text-xl mt-4 leading-snug text-neutral-200">“{r[3]}”</p><div className="mt-6 flex items-center gap-3"><div className="w-10 h-10 rounded-full btn-gold flex items-center justify-center text-sm tracking-normal">{r[0][0]}</div><div><p className="text-sm font-medium">{r[0]}</p><p className="text-xs text-neutral-500">{r[1]}, Nigeria · Verified Buyer</p></div></div></motion.div>)}</div></section>
<section className="py-24 bg-[#0c0c0c] border-y border-neutral-900"><div className="max-w-7xl mx-auto px-5"><div className="text-center mb-12"><p className="text-xs tracking-[.5em] text-[#2f80ff] mb-3">FOLLOW THE JOURNEY</p><h2 className="serif text-5xl">@apexkicks</h2></div>
<div className="grid grid-cols-3 md:grid-cols-6 gap-1.5">{shoes.slice(0,6).map((s,i)=><a key={i} href={`https://wa.me/${WA}`} className="relative aspect-square overflow-hidden group"><Img src={s.img} alt="" className="w-full h-full object-cover group-hover:scale-110 transition duration-700"/><div className="absolute inset-0 bg-black/60 opacity-0 group-hover:opacity-100 transition flex items-center justify-center text-sm">♥ {120+i*37}</div></a>)}</div></div></section>
</main>
<footer id="contact" className="pt-20 pb-28 px-6 bg-black"><div className="max-w-7xl mx-auto grid md:grid-cols-3 gap-12"><div><Logo s={1.2}/><p className="mt-5 text-sm text-neutral-400 max-w-xs leading-relaxed">APEX KICKS ENTERPRISE – Premium Footwear. Authentic luxury, delivered to your door.</p></div>
<div className="text-sm space-y-3 text-neutral-300"><p className="text-xs tracking-[.4em] text-[#2f80ff] mb-4">CONTACT</p><p>📍 Abuja, Nigeria – We deliver nationwide</p><p>☏ <a href={`tel:${PHONE}`} className="hover:text-[#2f80ff]">{PHONE}</a></p><p>✉ <a href={`mailto:${EMAIL}`} className="hover:text-[#2f80ff] break-all">{EMAIL}</a></p></div>

/* ---------------- ADMIN (/5154) ---------------- */
function Admin(){
const [ok,setOk]=useState(false);const [tab,setTab]=useState("orders");
const [shoes,setShoes]=useState(()=>ls.get("apex_shoes",SEED));const [orders,setOrders]=useState(()=>ls.get("apex_orders",[]));
const [f,setF]=useState(null);
useEffect(()=>{const p=window.prompt("Enter admin password");if(p==="5154")setOk(true);else location.replace("/")},[]);
if(!ok)return <div className="min-h-screen bg-black"/>;
const saveS=a=>{setShoes(a);ls.set("apex_shoes",a)};const saveO=a=>{setOrders(a);ls.set("apex_orders",a)};
const revenue=orders.filter(o=>o.status==="Confirmed"||o.status==="Delivered").reduce((a,o)=>a+o.total,0);
const clients=Object.values(orders.reduce((m,o)=>{const c=m[o.client]||(m[o.client]={name:o.client,n:0,spent:0,last:o.date});c.n++;if(o.status!=="Cancelled")c.spent+=o.total;return m},{}));
const submit=e=>{e.preventDefault();const s={...f,price:+f.price,stock:+f.stock};if(s.id)saveS(shoes.map(x=>x.id===s.id?s:x));else saveS([...shoes,{...s,id:Date.now()}]);setF(null)};
const Th=({c})=><th className="text-left text-[10px] tracking-widest uppercase text-neutral-500 font-medium px-4 py-3 whitespace-nowrap">{c}</th>;
const Td=({children,c=""})=><td className={"px-4 py-3 text-sm border-t border-neutral-900 "+c}>{children}</td>;
return(<div className="min-h-screen bg-[#08080a]"><div className="border-b border-neutral-900 px-5 h-16 flex items-center justify-between"><div className="flex items-center gap-3"><Logo s={1}/><span className="text-[10px] tracking-widest bg-[#2f80ff]/15 text-[#2f80ff] px-2 py-1">ADMIN</span></div><a href="/" className="text-xs text-neutral-400">← Store</a></div>
<div className="max-w-6xl mx-auto p-5">
<div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-8">{[["Total Revenue",N(revenue)],["Orders",orders.length],["Products",shoes.length],["Clients",clients.length]].map(k=><div key={k[0]} className="bg-[#111] border border-neutral-900 p-5"><p className="text-[10px] tracking-widest text-neutral-500 uppercase">{k[0]}</p><p className="serif text-3xl gold-text mt-2">{k[1]}</p></div>)}</div>
<div className="flex gap-2 mb-5 overflow-x-auto no-sb">{[["orders","Orders"],["stock","Stock & Shoes"],["clients","Clients"]].map(t=><button key={t[0]} onClick={()=>setTab(t[0])} className={"px-5 py-2 text-xs tracking-widest uppercase whitespace-nowrap "+(tab===t[0]?"btn-gold":"btn-out")}>{t[1]}</button>)}</div>
<div className="bg-[#111] border border-neutral-900 overflow-x-auto">
{tab==="orders"&&<table className="w-full"><thead><tr><Th c="ID"/><Th c="Client"/><Th c="Items"/><Th c="Total"/><Th c="Date"/><Th c="Status"/><Th c=""/></tr></thead><tbody>{!orders.length&&<tr><Td c="text-neutral-500">No orders yet.</Td></tr>}{orders.map(o=><tr key={o.id}><Td>{o.id}</Td><Td>{o.client}</Td><Td c="min-w-[220px]">{o.items}</Td><Td>{N(o.total)}</Td><Td c="whitespace-nowrap">{o.date}</Td><Td><select value={o.status} onChange={e=>saveO(orders.map(x=>x.id===o.id?{...x,status:e.target.value}:x))} className="px-2 py-1 text-xs">{["Pending","Confirmed","Delivered","Cancelled"].map(s=><option key={s}>{s}</option>)}</select></Td><Td><button onClick={()=>confirm("Delete order?")&&saveO(orders.filter(x=>x.id!==o.id))} className="text-xs text-red-400">Delete</button></Td></tr>)}</tbody></table>}
{tab==="stock"&&<><div className="p-4 flex justify-end"><button onClick={()=>setF({brand:"",model:"",price:50000,stock:10,img:""})} className="btn-gold px-5 py-3">+ Add Shoe</button></div>
<table className="w-full"><thead><tr><Th c="Shoe"/><Th c="Price"/><Th c="Stock"/><Th c=""/></tr></thead><tbody>{shoes.map(s=><tr key={s.id}><Td><div className="flex items-center gap-3 min-w-[200px]"><Img src={s.img} alt="" className="w-10 h-10 object-cover"/><div><p className="text-[10px] text-[#2f80ff] tracking-widest uppercase">{s.brand}</p>{s.model}</div></div></Td><Td>{N(s.price)}</Td><Td><input type="number" min="0" value={s.stock} onChange={e=>saveS(shoes.map(x=>x.id===s.id?{...x,stock:+e.target.value}:x))} className="w-20 px-2 py-1 text-sm"/></Td><Td c="whitespace-nowrap"><button onClick={()=>setF(s)} className="text-xs text-[#2f80ff] mr-4">Edit</button><button onClick={()=>confirm("Delete this shoe?")&&saveS(shoes.filter(x=>x.id!==s.id))} className="text-xs text-red-400">Delete</button></Td></tr>)}</tbody></table></>}
{tab==="clients"&&<table className="w-full"><thead><tr><Th c="Client"/><Th c="Orders"/><Th c="Total Spent"/><Th c="Last Order"/></tr></thead><tbody>{!clients.length&&<tr><Td c="text-neutral-500">No clients yet.</Td></tr>}{clients.map(c=><tr key={c.name}><Td>{c.name}</Td><Td>{c.n}</Td><Td>{N(c.spent)}</Td><Td>{c.last}</Td></tr>)}</tbody></table>}</div></div>
{f&&<div className="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4"><form onSubmit={submit} className="bg-[#111] border border-[#2f80ff]/40 p-6 w-full max-w-md space-y-3"><h3 className="serif text-2xl">{f.id?"Edit":"Add"} Shoe</h3>
{[["brand","Brand","text"],["model","Model","text"],["price","Price (₦)","number"],["stock","Stock","number"],["img","Image URL","url"]].map(x=><input key={x[0]} required type={x[2]} placeholder={x[1]} value={f[x[0]]} onChange={e=>setF({...f,[x[0]]:e.target.value})} className="w-full px-4 py-3 text-sm"/>)}
<div className="flex gap-2 pt-2"><button className="btn-gold flex-1 py-3">Save</button><button type="button" onClick={()=>setF(null)} className="btn-out flex-1 py-3">Cancel</button></div></form></div>}</div>)}

const isAdmin=location.pathname.replace(/\/+$/,"")==="/5154"||location.hash==="#5154"||location.hash==="#/5154";
ReactDOM.createRoot(document.getElementById("root")).render(isAdmin?<Admin/>:<Store/>);
</script>
</body>
